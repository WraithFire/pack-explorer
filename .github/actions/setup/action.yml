name: Setup Python and Dependencies
description: Checkout, set up Python 3.9, and install all dependencies

inputs:
  install-pyinstaller:
    description: Install PyInstaller for building executables
    required: false
    default: 'false'
  install-optional:
    description: Install optional dependencies from requirements-optional.txt
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Install PyInstaller
      if: inputs.install-pyinstaller == 'true'
      shell: bash
      run: |
        python -m pip install pyinstaller

    - name: Install optional dependencies
      if: inputs.install-optional == 'true'
      shell: bash
      run: |
        python -m pip install -r requirements-optional.txt
